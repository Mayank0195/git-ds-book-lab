name: ch19-dvc
on:
  push:
    branches: [book/ch19-dvc]
permissions:
  contents: read
jobs:
  dvc-tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install dvc
      - run: dvc --version
      - name: DVC tour
        run: scripts/dvc_tour.sh
