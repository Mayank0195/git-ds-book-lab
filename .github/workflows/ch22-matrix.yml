name: ch22-matrix
on:
  push:
    branches: [book/ch22-actions]
permissions:
  contents: read
concurrency:
  group: ch22-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    name: tests (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-churn
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pytest -q
