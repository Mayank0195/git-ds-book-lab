name: DVC pipeline
on:
  push:
    branches: [book/ch24-mlops]
    paths: ["dvc.yaml", ".github/workflows/dvc.yml"]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-ml.txt dvc
      - name: Initialise DVC and run the pipeline
        run: |
          git config user.name "ci-bot" && git config user.email "ci-bot@example.com"
          echo "mlflow.db" >> .gitignore
          dvc --version
          dvc init -q
          dvc dag
          dvc repro
          dvc repro
          dvc metrics show
      - name: Two experiments with other parameters
        run: |
          dvc exp run --set-param train.C=1.0 -n c-1 > /dev/null
          dvc exp run -S train.model=tree -S train.max_depth=4 -n tree-4 > /dev/null
          dvc exp show --no-pager --only-changed --drop 'Created|State|Executor' --md
