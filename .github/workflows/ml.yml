name: ML evaluation
on:
  pull_request:
    branches: [main, book/ch24-base]
    paths: ["src/**", "scripts/**", "params.yaml", "data/sample/**", "reports/baseline.json",
            "requirements-ml.txt", ".github/workflows/ml.yml"]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt
      - name: Train and evaluate
        run: PYTHONPATH=src python scripts/evaluate.py data/sample/customers.csv 2>/dev/null
      - name: Quality gate against the committed baseline
        run: |
          python scripts/compare_metrics.py reports/baseline.json reports/metrics.json \
            --max-drop 0.02 --markdown reports/comment.md
      - name: Job summary
        if: always()
        run: cat reports/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ml-report
          path: |
            reports/
            mlflow.db
          retention-days: 14

  comment:
    needs: evaluate
    if: always() && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ml-report
      - name: Create or update the metrics comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(cat reports/comment.md)
          id=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- ml-metrics -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            echo "updated comment $id"
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
            echo "created a new metrics comment"
          fi
