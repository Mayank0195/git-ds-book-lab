name: p3-os-matrix
on:
  push:
    branches: [book/p3-ci]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Platform
        run: python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version.split()[0])"
      - run: python -m pytest -q
