name: Release model
on:
  push:
    branches: ["release/**", "book/ch24-release"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-ml.txt
      - run: PYTHONPATH=src python scripts/evaluate.py data/sample/customers.csv
      - run: python scripts/compare_metrics.py reports/baseline.json reports/metrics.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-metrics
          path: reports/metrics.json

  tag:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write           # only this job may push
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        name: Create and push the release tag
        run: |
          tag="model-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "churn model released from $GITHUB_REF_NAME"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: [gate, tag]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://churn.staging.example.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-metrics
      - name: Deploy (illustrative)
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          echo "deploying $TAG (${GITHUB_SHA::7}) to staging"
          echo "metrics: $(tr -d ' \n' < metrics.json)"
          echo "a real job would push the image and update the serving platform here"
