name: smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show the runner
        run: |
          echo "runner: $RUNNER_OS $(uname -m)"
          git --version
          python3 --version
          git log --oneline -1
