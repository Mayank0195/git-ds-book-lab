[project]
name = "churn"
version = "0.1.0"
description = "Customer-churn prediction (lab project of the Git book)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["churn"]

[tool.coverage.report]
show_missing = true
skip_empty = true
